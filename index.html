<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap">
<style>
:root{--bg:#ebebeb;--fg:#111;--dim:#8c8c8c;--pill:#d4d4d4;--on:#f6f6f6;--col:min(420px,calc(100vw - 32px));color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:600 12px/1.25 "Archivo",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{all:unset;cursor:pointer}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}

/* cabecera */
.head{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:100;
  width:var(--col);display:flex;padding:3px;gap:2px;background:var(--pill);border-radius:8px}
.head button{flex:1;text-align:center;padding:7px 4px;border-radius:6px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;transition:background .2s}
.head button:hover{background:rgba(255,255,255,.45)}
.head button[aria-pressed=true]{background:var(--on)}
@media (max-width:400px){.head button{font-size:10.5px;padding:7px 2px}}

/* rueda 3D (de la web anterior) */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:4500px;overflow:hidden;touch-action:none;transition:opacity .3s}
.stage.off{opacity:0;pointer-events:none}
.wheel{position:relative;width:var(--cw);height:var(--cw);transform-style:preserve-3d;
  transform:rotateX(-12deg) rotateZ(18deg) rotateY(calc(var(--a,0) * 1deg));will-change:transform}
.card{position:absolute;inset:0;overflow:hidden;transform-style:preserve-3d;cursor:pointer;
  transform:rotateY(calc(var(--i) * var(--step) * 1deg)) translateZ(var(--r));transition:transform .4s ease-out}
.card img,.card video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.label{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-height:1em;transition:opacity .2s}

/* info */
.info{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:0 16px}
.info.on{display:grid}
.info div{display:grid;gap:14px;justify-items:center}
.info p{font-weight:400;font-size:15px;max-width:30ch;line-height:1.35}
.info a{color:var(--fg);text-decoration:none}
.info a:hover{opacity:.5}

/* visor de proyecto */
.modal{position:fixed;inset:0;z-index:90;background:rgba(235,235,235,.6);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:80px 16px 24px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.media{display:flex;justify-content:center;align-items:center;min-height:0}
.media img,.media video{max-width:min(85vw,1100px);max-height:68vh;object-fit:contain;display:block;user-select:none}
.ctrl{display:flex;align-items:center;gap:18px}
.ctrl button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.ctrl button:hover{background:var(--pill)}
.ctrl button[hidden]{display:none}
.count{font-weight:400;color:var(--dim)}
.title{text-align:center}

@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<nav class="head" aria-label="Secciones" id="head">
  <button data-f="arxiu">Arxiu</button>
  <button data-f="sobre">Sobre mi</button>
  <button data-f="contacte">Contacte</button>
</nav>

<div class="stage" id="stage"><div class="wheel" id="wheel"></div></div>
<div class="label" id="label" aria-live="polite"></div>

<div class="info" id="sobre"><div>
  <p>Diseño gráfico. Audiovisual, editorial y branding. Barcelona.</p>
</div></div>
<div class="info" id="contacte"><div>
  <a href="mailto:tu-correo@dominio.com">tu-correo@dominio.com</a>
  <a href="https://instagram.com/tu_usuario" target="_blank" rel="noopener">Instagram</a>
</div></div>

<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="media" id="media"></div>
  <div class="title" id="mtitle"></div>
  <div class="ctrl"><button id="prev" aria-label="Anterior">&#10094;</button><span class="count" id="count"></span><button id="next" aria-label="Siguiente">&#10095;</button></div>
</div>

<script>
/* Proyectos. La primera pieza de cada uno es la tarjeta de la rueda; al pulsarla se abren todas.
   Imagen: "nombre" (usa assets/nombre-t.webp en la rueda y assets/nombre.webp en el visor). Vídeo: "nombre.mp4". */
const A="assets/";
const PROJECTS=[
  {t:"Cal Besoret",tag:"branding",m:["besoret-2","besoret-1","besoret-4","besoret-7","besoret-3","besoret-5","besoret-6"]},
  {t:"MACBA Trenta",tag:"audiovisual",m:["macba.mp4"]},
  {t:"Bricolage Grotesque",tag:"editorial",m:["bricolage-1"]},
  {t:"Raly",tag:"audiovisual",m:["raly.mp4"]},
  {t:"Caliu",tag:"editorial",m:["caliu-1"]},
  {t:"Tipografía cinética",tag:"audiovisual",m:["tipo-cinetica.mp4"]},
  {t:"A Alcoi",tag:"editorial",m:["alcoi-1","alcoi-3","alcoi-2"]},
  {t:"Gràcies",tag:"audiovisual",m:["gracies.mp4"]}
];
const isV=s=>s.endsWith(".mp4"),$=s=>document.querySelector(s);
const stage=$("#stage"),wheel=$("#wheel"),label=$("#label"),modal=$("#modal"),media=$("#media");

/* tarjetas */
const cards=PROJECTS.map((p,i)=>{
  const c=document.createElement("button");c.className="card";c.dataset.tag=p.tag;c.setAttribute("aria-label",p.t);
  const f=p.m[0],n=f.replace(".mp4","");
  c.innerHTML=isV(f)?`<video src="${A+f}" poster="${A+n}-poster.jpg" autoplay muted loop playsinline preload="metadata"></video>`:`<img src="${A+f}-t.webp" alt="">`;
  c.addEventListener("click",()=>{if(!moved)openModal(i)});
  c.addEventListener("mouseenter",()=>label.textContent=p.t);c.addEventListener("mouseleave",()=>label.textContent="");
  c.addEventListener("focus",()=>label.textContent=p.t);
  wheel.append(c);return c});

/* coloca las tarjetas visibles en círculo; el radio crece con el número de tarjetas */
function layout(){
  // tarjeta cuadrada del 12% del ancho (como la web anterior); el radio deja un hueco pequeño entre tarjetas (GAP)
  const vis=cards.filter(c=>!c.hidden),n=vis.length;
  const GAP=.14,cw=Math.max(80,innerWidth*.12),r=cw*(1+GAP)/(2*Math.tan(Math.PI/Math.max(n,3)));
  wheel.style.setProperty("--cw",cw+"px");wheel.style.setProperty("--r",r+"px");wheel.style.setProperty("--step",360/Math.max(n,1));
  vis.forEach((c,k)=>c.style.setProperty("--i",k));
}
addEventListener("resize",layout);

/* giro continuo + inercia con la rueda del ratón o arrastrando */
let angle=0,extra=0,moved=false;const base=.25,friction=.94;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
addEventListener("wheel",e=>{if(!stage.classList.contains("off")&&!modal.classList.contains("on"))extra+=e.deltaY*.04},{passive:true});
let dragX=null;
stage.addEventListener("pointerdown",e=>{dragX=e.clientX;moved=false});
addEventListener("pointermove",e=>{if(dragX===null)return;const dx=e.clientX-dragX;if(Math.abs(dx)>4)moved=true;angle+=dx*.35;extra=dx*.15;dragX=e.clientX});
addEventListener("pointerup",()=>{dragX=null;setTimeout(()=>moved=false,0)});
(function spin(){if(!modal.classList.contains("on")&&!stage.classList.contains("off")){extra*=friction;angle+=(reduce?0:base)+extra;wheel.style.setProperty("--a",angle)}requestAnimationFrame(spin)})();

/* visor */
let gal=[],gi=0,gt="";
function render(){const f=gal[gi];
  media.innerHTML=isV(f)?`<video src="${A+f}" autoplay loop playsinline></video>`:`<img src="${A+f}.webp" alt="${gt}">`;
  $("#count").textContent=gal.length>1?`${gi+1} / ${gal.length}`:"";$("#prev").hidden=$("#next").hidden=gal.length<2}
function openModal(i){const p=PROJECTS[i];gal=p.m;gi=0;gt=p.t;$("#mtitle").textContent=p.t;render();
  modal.classList.add("on");modal.setAttribute("aria-hidden","false");cards.forEach(c=>{const v=c.querySelector("video");if(v)v.pause()});$("#next").focus()}
function closeModal(){if(!modal.classList.contains("on"))return;modal.classList.remove("on");modal.setAttribute("aria-hidden","true");media.innerHTML="";
  cards.forEach(c=>{const v=c.querySelector("video");if(v)v.play().catch(()=>{})})}
$("#next").onclick=e=>{e.stopPropagation();gi=(gi+1)%gal.length;render()};
$("#prev").onclick=e=>{e.stopPropagation();gi=(gi-1+gal.length)%gal.length;render()};
modal.addEventListener("click",e=>{if(e.target===modal||e.target===media)closeModal()});
addEventListener("keydown",e=>{if(!modal.classList.contains("on"))return;
  if(e.key==="Escape")closeModal();if(e.key==="ArrowRight")$("#next").click();if(e.key==="ArrowLeft")$("#prev").click()});

/* cabecera: Arxiu muestra la rueda; Sobre mi y Contacte, su texto */
function setFilter(f){closeModal();
  stage.classList.toggle("off",f!=="arxiu");label.textContent="";
  ["sobre","contacte"].forEach(id=>$("#"+id).classList.toggle("on",f===id));
  layout();
  document.querySelectorAll("#head button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f));
  const u=new URL(location.href);f==="arxiu"?u.searchParams.delete("s"):u.searchParams.set("s",f);try{history.replaceState(null,"",u)}catch(e){}
}
document.querySelectorAll("#head button").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
const start=new URLSearchParams(location.search).get("s");
setFilter(["sobre","contacte"].includes(start)?start:"arxiu");
</script>
</body>
</html>
