<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap">
<style>
:root{--bg:#ebebeb;--fg:#111;--dim:#8c8c8c;--pill:#d4d4d4;--on:#f6f6f6;--col:min(420px,calc(100vw - 32px));color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:600 12px/1.25 "Archivo",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{all:unset;cursor:pointer}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}

/* cabecera */
.head{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;
  width:var(--col);display:flex;padding:3px;gap:2px;background:var(--pill);border-radius:8px}
.head button{flex:1;text-align:center;padding:7px 4px;border-radius:6px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;transition:background .2s}
.head button:hover{background:rgba(255,255,255,.45)}
.head button[aria-pressed=true]{background:var(--on)}
@media (max-width:400px){.head button{font-size:10.5px;padding:7px 2px}}

/* carrusel vertical */
.reel{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.slide{height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:84px 16px 40px}
.slide[hidden]{display:none}
figure{width:var(--col);display:grid;gap:10px}
figure img,figure video{width:100%;max-height:56vh;object-fit:contain;display:block;cursor:pointer}
figcaption{display:flex;justify-content:space-between;gap:16px}
figcaption span{color:var(--dim);font-weight:400}

.info{width:var(--col);display:grid;gap:16px}
.info p{font-weight:400;font-size:15px;line-height:1.35}
.info a{color:var(--fg)}
</style>
</head>
<body>

<nav class="head" aria-label="Secciones" id="head">
  <button data-f="todo">Joan</button>
  <button data-f="audiovisual">Audiovisual</button>
  <button data-f="editorial">Editorial</button>
  <button data-f="branding">Branding</button>
  <button data-f="info">Info</button>
</nav>

<main class="reel" id="reel"></main>

<script>
/* Proyectos: cada imagen o vídeo es una pantalla del carrusel. tag: audiovisual | editorial | branding */
const A="assets/";
const PROJECTS=[
  {t:"Cal Besoret",tag:"branding",m:["besoret-2","besoret-1","besoret-4","besoret-7","besoret-3","besoret-5","besoret-6"]},
  {t:"MACBA Trenta",tag:"audiovisual",v:"macba"},
  {t:"A Alcoi",tag:"editorial",m:["alcoi-1","alcoi-3","alcoi-2"]},
  {t:"Raly",tag:"audiovisual",v:"raly"},
  {t:"Caliu",tag:"editorial",m:["caliu-1"]},
  {t:"Tipografía cinética",tag:"audiovisual",v:"tipo-cinetica"},
  {t:"Bricolage Grotesque",tag:"editorial",m:["bricolage-1"]},
  {t:"Gràcies",tag:"audiovisual",v:"gracies"}
];
const INFO={text:"Diseño gráfico. Audiovisual, editorial y branding. Barcelona.",mail:"tu-correo@dominio.com",ig:"tu_usuario"};

const $=s=>document.querySelector(s),reel=$("#reel"),slides=[];
PROJECTS.forEach(p=>{
  const items=p.v?[{v:p.v}]:p.m.map(n=>({i:n}));
  items.forEach((it,k)=>{
    const s=document.createElement("section");s.className="slide";s.dataset.tag=p.tag;
    const media=it.v
      ?`<video src="${A+it.v}.mp4" poster="${A+it.v}-poster.jpg" muted loop playsinline preload="none" aria-label="${p.t}. Toca para activar el sonido"></video>`
      :`<img src="${A+it.i}-t.webp" data-full="${A+it.i}.webp" alt="${p.t}" decoding="async" ${slides.length>1?'loading="lazy"':""}>`;
    s.innerHTML=`<figure>${media}<figcaption>${p.t}<span>${items.length>1?`${k+1}/${items.length}`:""}</span></figcaption></figure>`;
    reel.append(s);slides.push(s)});
});
const info=document.createElement("section");info.className="slide";info.dataset.tag="info";
info.innerHTML=`<div class="info"><p>${INFO.text}</p><p><a href="mailto:${INFO.mail}">${INFO.mail}</a><br><a href="https://instagram.com/${INFO.ig}" target="_blank" rel="noopener">Instagram</a></p></div>`;
reel.append(info);slides.push(info);

/* imagen a mayor resolución cuando se acerca a pantalla; vídeo solo en la pantalla activa */
const io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target,img=s.querySelector("img[data-full]"),v=s.querySelector("video");
  if(e.isIntersecting){if(img&&img.dataset.full){img.src=img.dataset.full;delete img.dataset.full}
    if(v&&e.intersectionRatio>.6){v.preload="auto";v.play().catch(()=>{})}}
  if(v&&e.intersectionRatio<.6)v.pause()}),{root:reel,threshold:[0,.6]});
slides.forEach(s=>io.observe(s));
reel.addEventListener("click",e=>{const v=e.target.closest("video");if(v){v.muted=!v.muted;if(v.paused)v.play()}});

/* filtros de la cabecera */
function setFilter(f){
  slides.forEach(s=>s.hidden=!(f==="todo"||f==="info"||s.dataset.tag===f||s.dataset.tag==="info"));
  document.querySelectorAll("#head button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f));
  (f==="info"?info:slides.find(s=>!s.hidden)).scrollIntoView({behavior:f==="info"?"smooth":"instant"});
  const u=new URL(location.href);f==="todo"?u.searchParams.delete("filter"):u.searchParams.set("filter",f);try{history.replaceState(null,"",u)}catch(e){}
}
document.querySelectorAll("#head button").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
const start=new URLSearchParams(location.search).get("filter");
setFilter(["audiovisual","editorial","branding","info"].includes(start)?start:"todo");

/* teclado */
addEventListener("keydown",e=>{const vis=slides.filter(s=>!s.hidden),r=reel.scrollTop,i=vis.findIndex(s=>Math.abs(s.offsetTop-r)<innerHeight/2);
  if(["ArrowDown","PageDown"].includes(e.key)&&vis[i+1]){e.preventDefault();vis[i+1].scrollIntoView({behavior:"smooth"})}
  if(["ArrowUp","PageUp"].includes(e.key)&&vis[i-1]){e.preventDefault();vis[i-1].scrollIntoView({behavior:"smooth"})}});
</script>
</body>
</html>
